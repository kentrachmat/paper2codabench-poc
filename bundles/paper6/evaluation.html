<h1>Evaluation</h1>
<h2>Metrics</h2>
<p>Primary metric: <strong>Area Under the ROC Curve (AUC), Fairness Equal Opportunity (FEO)</strong></p>
<p>Sorting: desc (higher is better = desc)</p>
<h2>Scoring</h2>
<p>Submissions are evaluated by comparing the predicted values against the reference data using the primary metric.</p>
